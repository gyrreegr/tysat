name: TY Processing

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  process_nc:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests urllib3 matplotlib cartopy geopandas pyproj shapely

      - name: Run miulit_path Processing
        run: python ty_various_path.py
      - name: Run CWA ty Processing
        run: python cwa_typhoon.py

      # push
      - name: Commit & Push outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin \
          https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          
          git add .
          git commit -m "Update satellite and radar images [skip ci]" || echo "No changes"
          git pull --rebase origin main
          git push origin main
